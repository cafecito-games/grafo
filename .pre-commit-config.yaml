default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]
        exclude: ^internal/storage/sqlite/sqlcgen/

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy -diff
        language: system
        files: ^(go\.mod|go\.sum|.*\.go)$
        pass_filenames: false

      - id: sqlc-generated
        name: sqlc generated code
        entry: task generate:check
        language: system
        files: ^(sqlc\.yaml|internal/storage/sqlite/(migrations|queries)/.*\.sql)$
        pass_filenames: false

  # Keep this revision equal to the version run in CI. CI invokes this hook,
  # making this configuration the single source of truth for the linter.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0
    hooks:
      - id: golangci-lint-config-verify
      - id: golangci-lint-full
        name: golangci-lint
        entry: golangci-lint run ./...
        files: ^(go\.(mod|sum)|\.golangci\.(yml|yaml|toml|json)|.*\.go)$
        types: [file]
