name: PR Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  build-vet:
    name: Build & Vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The Go caches are handled below instead of here. setup-go derives one
          # key from the OS, Go version and go.sum hash, so every job on this
          # runner shares it, and the first job to finish its post step wins the
          # save. The job that compiles nothing won, which pinned a 7 KiB entry
          # that every later job hit and therefore never replaced.
          cache: false

      # The module cache is byte-identical in every job and changes only when
      # go.sum does, so it gets one entry keyed on go.sum alone rather than one
      # copy per job per push. It has to be its own entry: actions/cache derives
      # a version from the path list, and an entry saved under one list is
      # invisible to a restore declaring another, which is why every restore and
      # save here and in release.yml moves together.
      #
      # No restore-keys, unlike the jobs below: this is the job that saves the
      # entry, and falling back to an older go.sum's modules would make it save
      # that older set alongside the current one, growing the entry on every
      # dependency change.
      - uses: actions/cache/restore@v4
        id: go-mod-cache
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}

      # Restored on every run, saved only from main: a pull request reuses the
      # default branch's warm build cache without spending the repository's
      # cache budget on an entry nobody else will read.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-build-vet-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-build-vet-${{ hashFiles('**/go.sum') }}-
            go-build-${{ runner.os }}-build-vet-

      # Explicit, and the gate on the module cache save below. That entry is
      # immutable once written, so a save that fired after a step died partway
      # through resolving the module set would pin a torn copy under the exact
      # key until it aged out. Succeeding here proves the build list downloaded
      # whole; the save still runs last, so it stores whatever the steps after
      # this one added too.
      - name: Download modules
        id: go-mod-download
        run: go mod download

      - uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^internal/storage/sqlite/sqlcgen/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy -diff

      - name: Build
        run: task build

      - name: Vet
        run: task vet

      # Written whenever the exact key missed, from a pull request as well as
      # from main, which the build caches below are not: this entry is keyed on
      # go.sum alone, so every job and both workflows read it, and a go.sum
      # change that so far exists only on a branch would otherwise leave six
      # jobs downloading the module set cold on every push to that branch. This
      # is the job that saves it because `go mod tidy -diff` and `go vet ./...`
      # load every package and so leave the whole module set behind; a race lane
      # only has its own shard's.
      - uses: actions/cache/save@v4
        if: >-
          always() && steps.go-mod-download.outcome == 'success'
          && steps.go-mod-cache.outputs.cache-hit != 'true'
        # A key another run already reserved must never fail main's checks.
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}

      # The key carries the commit, so each push to main writes a fresh entry
      # rather than hitting its own primary key and keeping a stale one forever.
      # always() so a failing step still publishes the compilation it paid for.
      # This is also the build cache release.yml restores: it holds the compiled
      # dependencies, including the cgo grammars, which is what a cold build
      # spends its time on.
      - uses: actions/cache/save@v4
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        # A key another run already reserved must never fail main's checks.
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-build-vet-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  race:
    # One lane per shard, because the step's wall clock was the sum of every
    # package's run divided over the runner's 4 cores, and a handful of serial
    # packages accounted for most of it. cmd/grafo-test-shards owns the split;
    # the lane names here are its shard names and must stay in step with them,
    # which -shards below enforces.
    name: Test (race, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every lane reports: a failure in one must not hide a failure in another.
      fail-fast: false
      matrix:
        shard: [eval, federation, indexer, rest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Keyed per lane below, for the reason given in build-vet.
          cache: false

      # Shared with every other job; see build-vet. This lane never saves the
      # entry, so it can fall back to an older go.sum's modules and download
      # only the difference instead of the whole set.
      - uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-

      # Each lane compiles only its own packages, so each keeps its own entry
      # rather than racing the others to save a partial one under a shared key.
      # A lane with no history of its own falls back to build-vet's entry, which
      # already holds the dependencies' object code, instead of starting cold.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-race-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-race-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-
            go-build-${{ runner.os }}-race-${{ matrix.shard }}-
            go-build-${{ runner.os }}-build-vet-${{ hashFiles('**/go.sum') }}-
            go-build-${{ runner.os }}-build-vet-

      # -count=1 defeats the test result cache, not the build cache. The step
      # above restores a warm build cache, which also makes go test find its
      # recorded results and skip packages whose inputs did not change: on one
      # warm run, 41 of 49 packages reported (cached), including every heavy
      # one. That is sound, but this step is the gate, and a cached pass cannot
      # catch a flake in the parallel tests it is here to protect.
      - name: Test (race)
        run: |
          packages="$(go run ./cmd/grafo-test-shards -shards 4 -shard '${{ matrix.shard }}')"
          if [ -z "$packages" ]; then
            echo "::error::shard ${{ matrix.shard }} resolved to no packages"
            exit 1
          fi
          echo "::group::packages in this shard"
          echo "$packages"
          echo "::endgroup::"
          # Unquoted on purpose: one argument per package.
          # shellcheck disable=SC2086
          go test -race -count=1 $packages

      - uses: actions/cache/save@v4
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        # A key another run already reserved must never fail main's checks.
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-race-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  build-test:
    # Branch protection requires this context by name, and splitting the work
    # above into a matrix would otherwise leave it unreported. It is the single
    # check that covers every lane, so it must fail unless all of them passed;
    # a matrix job's result is success only when every lane succeeded.
    name: Build & Test
    needs: [build-vet, race]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane to have passed
        run: |
          echo "Build & Vet: ${{ needs.build-vet.result }}"
          echo "Test (race): ${{ needs.race.result }}"
          if [ "${{ needs.build-vet.result }}" != "success" ] || [ "${{ needs.race.result }}" != "success" ]; then
            echo "::error::Build & Vet or one of the race shards did not pass"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Keyed per job below, for the reason given in build-test.
          cache: false

      # Shared with every other job; see build-vet.
      - uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-

      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-lint-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-lint-${{ hashFiles('**/go.sum') }}-
            go-build-${{ runner.os }}-lint-

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.5.3"
          extra-args: golangci-lint-full --all-files

      - uses: actions/cache/save@v4
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        # A key another run already reserved must never fail main's checks.
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-lint-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  generated:
    name: Generated Code Up To Date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # This job runs sqlc and a git diff; it compiles no Go, so it has no
          # build cache worth keeping and must not write one. Sharing setup-go's
          # single key is what let this job pin an empty cache for the others.
          cache: false

      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"

      - uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated code
        run: task generate:check

  release-snapshot:
    name: Release Snapshot
    # Matches the release job: CGO targets cross-compile from macOS.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
