name: PR Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  build-vet:
    name: Build & Vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The Go caches are handled below instead of here. setup-go derives one
          # key from the OS, Go version and go.sum hash, so every job on this
          # runner shares it, and the first job to finish its post step wins the
          # save. The job that compiles nothing won, which pinned a 7 KiB entry
          # that every later job hit and therefore never replaced.
          cache: false

      # Restored on every run, saved only from main: a pull request reuses the
      # default branch's warm caches without spending the repository's cache
      # budget on an entry nobody else will read.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-build-test-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-build-test-${{ hashFiles('**/go.sum') }}-
            go-${{ runner.os }}-build-test-

      - uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^internal/storage/sqlite/sqlcgen/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy -diff

      - name: Build
        run: task build

      - name: Vet
        run: task vet

      # The key carries the commit, so each push to main writes a fresh entry
      # rather than hitting its own primary key and keeping a stale one forever.
      # always() so a failing step still publishes the compilation it paid for.
      # This is also the entry release.yml restores: it holds the module cache
      # and the compiled dependencies, including the cgo grammars, which is what
      # a cold build spends its time on.
      - uses: actions/cache/save@v4
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        # A key another run already reserved must never fail main's checks.
        continue-on-error: true
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-build-test-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  race:
    # One lane per shard, because the step's wall clock was the sum of every
    # package's run divided over the runner's 4 cores, and a handful of serial
    # packages accounted for most of it. cmd/grafo-test-shards owns the split;
    # the lane names here are its shard names and must stay in step with them,
    # which -shards below enforces.
    name: Test (race, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every lane reports: a failure in one must not hide a failure in another.
      fail-fast: false
      matrix:
        shard: [eval, federation, indexer, rest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Keyed per lane below, for the reason given in build-vet.
          cache: false

      # Each lane compiles only its own packages, so each keeps its own entry
      # rather than racing the others to save a partial one under a shared key.
      # A lane with no history of its own falls back to build-vet's entry, which
      # already holds the dependencies, instead of starting cold.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-race-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-race-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-
            go-${{ runner.os }}-race-${{ matrix.shard }}-
            go-${{ runner.os }}-build-test-${{ hashFiles('**/go.sum') }}-
            go-${{ runner.os }}-build-test-

      # -count=1 defeats the test result cache, not the build cache. The step
      # above restores a warm build cache, which also makes go test find its
      # recorded results and skip packages whose inputs did not change: on one
      # warm run, 41 of 49 packages reported (cached), including every heavy
      # one. That is sound, but this step is the gate, and a cached pass cannot
      # catch a flake in the parallel tests it is here to protect.
      - name: Test (race)
        run: |
          packages="$(go run ./cmd/grafo-test-shards -shards 4 -shard '${{ matrix.shard }}')"
          if [ -z "$packages" ]; then
            echo "::error::shard ${{ matrix.shard }} resolved to no packages"
            exit 1
          fi
          echo "::group::packages in this shard"
          echo "$packages"
          echo "::endgroup::"
          # Unquoted on purpose: one argument per package.
          # shellcheck disable=SC2086
          go test -race -count=1 $packages

      - uses: actions/cache/save@v4
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        # A key another run already reserved must never fail main's checks.
        continue-on-error: true
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-race-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  build-test:
    # Branch protection requires this context by name, and splitting the work
    # above into a matrix would otherwise leave it unreported. It is the single
    # check that covers every lane, so it must fail unless all of them passed;
    # a matrix job's result is success only when every lane succeeded.
    name: Build & Test
    needs: [build-vet, race]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane to have passed
        run: |
          echo "Build & Vet: ${{ needs.build-vet.result }}"
          echo "Test (race): ${{ needs.race.result }}"
          if [ "${{ needs.build-vet.result }}" != "success" ] || [ "${{ needs.race.result }}" != "success" ]; then
            echo "::error::Build & Vet or one of the race shards did not pass"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Keyed per job below, for the reason given in build-test.
          cache: false

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-lint-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-lint-${{ hashFiles('**/go.sum') }}-
            go-${{ runner.os }}-lint-

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.5.3"
          extra-args: golangci-lint-full --all-files

      - uses: actions/cache/save@v4
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        # A key another run already reserved must never fail main's checks.
        continue-on-error: true
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-lint-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  generated:
    name: Generated Code Up To Date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # This job runs sqlc and a git diff; it compiles no Go, so it has no
          # build cache worth keeping and must not write one. Sharing setup-go's
          # single key is what let this job pin an empty cache for the others.
          cache: false

      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"

      - uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated code
        run: task generate:check

  release-snapshot:
    name: Release Snapshot
    # Matches the release job: CGO targets cross-compile from macOS.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
