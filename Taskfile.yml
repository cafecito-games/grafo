version: "3"

tasks:
  build:
    desc: Build the Grafo CLI
    cmds:
      - go build ./cmd/grafo

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  eval:resolution:
    desc: Run the deterministic parser-to-query resolution corpus
    cmds:
      - go test ./internal/eval/... -run TestResolutionCorpus -count=1

  eval:update:
    desc: Atomically update resolution corpus expectations after a reviewed graph change
    cmds:
      - go run ./internal/eval/cmd/grafo-eval -update ./internal/eval/testdata

  vet:
    desc: Run Go static analysis
    cmds:
      - go vet ./...

  lint:
    desc: Run the pinned golangci-lint hook (same version and configuration as CI)
    cmds:
      - prek run golangci-lint-full --all-files

  hooks:install:
    desc: Install the prek Git hooks
    cmds:
      - prek install

  hooks:run:
    desc: Run all prek pre-commit hooks against the repository
    cmds:
      - prek run --all-files

  generate:
    desc: Regenerate the type-safe SQLite repository with sqlc
    sources:
      - sqlc.yaml
      - internal/storage/sqlite/migrations/*.sql
      - internal/storage/sqlite/queries/*.sql
    generates:
      - internal/storage/sqlite/sqlcgen/*.go
    cmds:
      - sqlc generate

  generate:check:
    desc: Verify the generated SQLite repository is up to date
    cmds:
      - sqlc generate
      - git diff --exit-code -- internal/storage/sqlite/sqlcgen

  check:
    desc: Generate, test, vet, and build
    deps: [generate]
    cmds:
      - task: test
      - task: vet
      - task: build

  bench:corpus:
    desc: Run the opt-in production indexing corpus benchmark
    cmds:
      - go run ./cmd/grafo-benchmark

  bench:storage:
    desc: Compare SQLite, bbolt, and Pebble with repeated generated and corpus samples
    cmds:
      - go run ./cmd/grafo-storage-benchmark

  bench:storage:layout:
    desc: Compare SQLite storage layouts with gated fixture and corpus samples
    cmds:
      - go run ./cmd/grafo-storage-layout-benchmark

  bench:detail-profiles:
    desc: Run the opt-in capability-safe detail-profile spike benchmark
    cmds:
      - go run ./cmd/grafo-detail-benchmark
